<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>요한복음 21주 말씀런 · 조원용</title>
<!-- 홈 화면에 추가(설치) 경로 — 이게 없으면 기기·브라우저마다 "설치하기"가 제각각으로
     동작하거나 아예 안 뜬다(아이콘 없음·standalone 미지원). 파일명·URL 은 QR 이 그대로
     인코딩하고 있으므로 절대 바꾸지 않는다. -->
<link rel="manifest" href="manifest-member.json">
<meta name="theme-color" content="#b9862f">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="말씀런 조원">
<link rel="apple-touch-icon" href="icons/member-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/member-192.png">

<style>
  :root {
    --bg: #f5efe1;
    --bg-soft: #ebe2cd;
    --ink: #1c2431;
    --ink-soft: #55524a;
    --navy: #1f3b57;
    --navy-soft: #2c4d6e;
    --gold: #b9862f;
    --gold-soft: #e8cf9a;
    --card: #fffdf7;
    --border: #ddd0ad;
    --ring: #b9862f;
    --danger: #a3402e;
    --danger-soft: #f3ddd5;
    --ok: #3f6b3f;
    --ok-soft: #dcead9;
    color-scheme: light;
  }
  :root[data-theme="dark"] {
    --bg: #0d1420;
    --bg-soft: #131d2d;
    --ink: #ece4d2;
    --ink-soft: #b7ac93;
    --navy: #9fc2e8;
    --navy-soft: #6f97c2;
    --gold: #e8c26b;
    --gold-soft: #4a3d20;
    --card: #131b29;
    --border: #2b3a4f;
    --ring: #e8c26b;
    --danger: #e08a72;
    --danger-soft: #3a2119;
    --ok: #8fcf8a;
    --ok-soft: #17301a;
    color-scheme: dark;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0d1420;
      --bg-soft: #131d2d;
      --ink: #ece4d2;
      --ink-soft: #b7ac93;
      --navy: #9fc2e8;
      --navy-soft: #6f97c2;
      --gold: #e8c26b;
      --gold-soft: #4a3d20;
      --card: #131b29;
      --border: #2b3a4f;
      --ring: #e8c26b;
      --danger: #e08a72;
      --danger-soft: #3a2119;
      --ok: #8fcf8a;
      --ok-soft: #17301a;
      color-scheme: dark;
    }
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--ink); overflow-x: hidden; }
  body {
    font-family: "Apple SD Gothic Neo", "Pretendard", "Malgun Gothic", "Noto Sans KR", sans-serif;
    line-height: 1.5;
    padding: clamp(12px, 4vw, 32px) clamp(12px, 4vw, 32px) 64px;
  }
  .page { width: 100%; max-width: 640px; margin: 0 auto; }

  .eyebrow {
    font-size: 0.76rem;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--gold);
    font-weight: 700;
    margin: 0 0 6px;
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
  }
  .member-badge {
    font-size: 0.68rem;
    font-weight: 800;
    padding: 2px 9px;
    border-radius: 999px;
    background: var(--navy);
    color: #fff;
  }
  :root[data-theme="dark"] .member-badge { background: var(--gold); color: #1a1305; }
  @media (prefers-color-scheme: dark) { .member-badge { background: var(--gold); color: #1a1305; } }

  h1 {
    font-family: "Noto Serif KR", "Nanum Myeongjo", "Batang", serif;
    font-weight: 700;
    font-size: clamp(1.35rem, 5vw, 1.9rem);
    margin: 0 0 4px;
    text-wrap: balance;
    color: var(--ink);
  }
  .sub { color: var(--ink-soft); font-size: 0.9rem; margin: 0 0 18px; }

  .theme-toggle {
    position: fixed;
    top: 12px; right: 12px;
    font-family: inherit;
    font-size: 0.74rem;
    padding: 6px 11px;
    border-radius: 999px;
    border: 1px solid var(--border);
    background: var(--card);
    color: var(--ink-soft);
    cursor: pointer;
    z-index: 5;
  }
  .theme-toggle:focus-visible { outline: 2px solid var(--ring); outline-offset: 2px; }

  .status-bar {
    background: var(--bg-soft);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 14px 16px;
    margin-bottom: 16px;
  }
  .status-top { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
  .status-title { font-weight: 700; font-size: 1.05rem; color: var(--ink); }
  .status-title .gold { color: var(--gold); }
  .status-day {
    font-weight: 700;
    font-size: 0.85rem;
    padding: 3px 10px;
    border-radius: 999px;
    background: var(--navy);
    color: var(--card);
  }
  :root[data-theme="dark"] .status-day { background: var(--gold-soft); color: var(--gold); }
  @media (prefers-color-scheme: dark) { .status-day { background: var(--gold-soft); color: var(--gold); } }

  .status-nav { display: flex; align-items: center; gap: 6px; margin-top: 10px; flex-wrap: wrap; }
  .sync-code-row { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
  .sync-code-row input { flex: 1; min-width: 160px; }
  .nav-btn, .action-btn {
    font-family: inherit;
    font-size: 0.8rem;
    font-weight: 600;
    padding: 7px 12px;
    border-radius: 9px;
    border: 1px solid var(--border);
    background: var(--card);
    color: var(--ink-soft);
    cursor: pointer;
    white-space: nowrap;
  }
  .nav-btn:hover, .action-btn:hover { color: var(--ink); border-color: var(--ink-soft); }
  .nav-btn:focus-visible, .action-btn:focus-visible { outline: 2px solid var(--ring); outline-offset: 1px; }
  .action-btn.primary { background: var(--navy); border-color: var(--navy); color: #fff; }
  :root[data-theme="dark"] .action-btn.primary { background: var(--gold); border-color: var(--gold); color: #1a1305; }
  @media (prefers-color-scheme: dark) { .action-btn.primary { background: var(--gold); border-color: var(--gold); color: #1a1305; } }
  .action-btn.danger { color: var(--danger); border-color: var(--danger); background: transparent; }
  .action-btn.armed { background: var(--danger); border-color: var(--danger); color: #fff; }
  .status-note { color: var(--ink-soft); font-size: 0.78rem; margin-top: 8px; }

  .tabs { display: flex; gap: 6px; margin-bottom: 16px; border-bottom: 1px solid var(--border); }
  .tab-btn {
    font-family: inherit;
    font-size: 0.86rem;
    font-weight: 700;
    padding: 9px 14px;
    border: none;
    background: none;
    color: var(--ink-soft);
    cursor: pointer;
    border-bottom: 3px solid transparent;
    margin-bottom: -1px;
  }
  .tab-btn[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--gold); }
  .tab-btn:focus-visible { outline: 2px solid var(--ring); outline-offset: 2px; }
  .tab-panel { display: none; }
  .tab-panel.active { display: block; }

  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 16px;
    margin-bottom: 14px;
  }
  .card h2 {
    font-size: 0.8rem;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--ink-soft);
    margin: 0 0 12px;
    font-weight: 700;
  }
  .empty-note {
    color: var(--ink-soft);
    font-size: 0.85rem;
    background: var(--bg-soft);
    border: 1px dashed var(--border);
    border-radius: 12px;
    padding: 14px;
    text-align: center;
  }

  .quiz-ref { font-size: 0.78rem; color: var(--gold); font-weight: 700; margin: 0 0 6px; }
  .quiz-blank { font-size: 1.02rem; margin: 0 0 14px; }

  input[type="text"], input[type="date"] {
    font-family: inherit;
    font-size: 0.92rem;
    padding: 10px 12px;
    border-radius: 9px;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--ink);
    width: 100%;
    min-width: 0;
  }
  input[type="text"]:focus-visible, input[type="date"]:focus-visible { outline: 2px solid var(--ring); outline-offset: 1px; }
  label.field-label { display: block; font-size: 0.82rem; color: var(--ink-soft); margin-bottom: 6px; font-weight: 600; }
  .field-row { margin-bottom: 14px; }

  .kakao-box {
    width: 100%;
    background: var(--bg-soft);
    border: 1px dashed var(--border);
    border-radius: 12px;
    padding: 10px 12px;
    margin: 10px 0 0;
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
  }
  .kakao-box .kakao-text { flex: 1; min-width: 160px; font-size: 0.82rem; color: var(--ink); overflow-wrap: anywhere; }
  .kakao-box .kakao-label { font-size: 0.7rem; color: var(--gold); font-weight: 700; display: block; margin-bottom: 3px; }

  .submit-badge {
    display: inline-block;
    font-size: 0.75rem;
    font-weight: 700;
    padding: 3px 10px;
    border-radius: 999px;
    background: var(--ok-soft);
    color: var(--ok);
    margin-bottom: 10px;
  }
  .disclaimer { font-size: 0.74rem; color: var(--ink-soft); margin-top: 8px; }

  .week-summary-row {
    display: flex;
    flex-wrap: wrap;
    justify-content: space-between;
    align-items: baseline;
    gap: 4px 10px;
    padding: 8px 0;
    border-bottom: 1px solid var(--border);
    font-size: 0.88rem;
  }
  .week-summary-row:last-child { border-bottom: none; }
  .week-summary-row .wd-label { font-weight: 700; color: var(--ink); flex: none; }
  .week-summary-row .wd-status { color: var(--ink-soft); overflow-wrap: anywhere; text-align: right; min-width: 0; flex: 1 1 auto; }
  .week-summary-row .wd-status.done { color: var(--ok); font-weight: 600; }

  .onboard-card { max-width: 420px; margin: 0 auto; }

  .photo-upload-wrap { margin-top: 10px; }
  .photo-preview {
    display: block;
    max-width: 220px;
    width: 100%;
    border-radius: 12px;
    border: 1px solid var(--border);
    margin-bottom: 10px;
  }
  input[type="file"] { display: none; }

  /* 카카오톡 등 인앱 브라우저 안내 배너 — 감지됐을 때만 노출된다. 기존 온보딩·상태바 흐름에는
     전혀 손대지 않고 그 위에 얹기만 한다. 우측 상단 고정 테마 토글과 겹치지 않게 오른쪽
     여백을 크게 잡았다. */
  .inapp-banner {
    width: 100%;
    max-width: 640px;
    margin: 0 auto 14px;
    padding: 12px 92px 12px 14px;
    background: var(--gold-soft);
    border: 1px solid var(--gold);
    border-radius: 14px;
    color: var(--ink);
    font-size: 0.84rem;
    line-height: 1.5;
  }
  .inapp-banner .inapp-title {
    display: block;
    margin-bottom: 4px;
    font-size: 0.72rem;
    font-weight: 700;
    letter-spacing: 0.1em;
    color: var(--gold);
  }
  :root[data-theme="dark"] .inapp-banner .inapp-title { color: var(--ring); }
  .inapp-banner .inapp-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
  .inapp-banner button {
    font-family: inherit;
    font-size: 0.8rem;
    font-weight: 700;
    padding: 8px 13px;
    border-radius: 999px;
    border: 1px solid var(--border);
    background: var(--card);
    color: var(--ink);
    cursor: pointer;
  }
  .inapp-banner button.primary { background: var(--navy); border-color: var(--navy); color: var(--card); }
  .inapp-banner button:focus-visible { outline: 2px solid var(--ring); outline-offset: 2px; }
  .inapp-banner .inapp-note { margin: 8px 0 0; font-size: 0.76rem; color: var(--ink-soft); }
</style>
</head>
<body>
<button class="theme-toggle" id="themeToggle" type="button" aria-label="테마 전환">라이트 / 다크</button>

<!-- 카카오톡 등 인앱 브라우저 안내 — 기본은 숨김이고, 아래 스크립트가 userAgent 로 감지했을
     때만 보여준다. 기존 DOM(온보딩·상태바·탭)은 그대로 두고 위에 얹기만 한다. -->
<div class="inapp-banner" id="inappBanner" style="display:none;" role="status">
  <span class="inapp-title">잠깐만요</span>
  <span id="inappBannerText"></span>
  <div class="inapp-actions">
    <button class="primary" id="inappOpenBtn" type="button" style="display:none;">다른 브라우저로 열기</button>
    <button id="inappCopyBtn" type="button">링크 복사</button>
  </div>
  <p class="inapp-note" id="inappNote"></p>
</div>

<script>
  // 인앱 브라우저(카카오톡·네이버·인스타 등) 감지 안내.
  // 이 앱 주소는 카톡으로 공유될 가능성이 높은데, 카카오톡 인앱브라우저는 제조사별 WebView
  // 차이 때문에 "홈 화면에 추가"와 파일 선택(사진 올리기)이 기종마다 다르게 실패한다.
  // 감지되면 기본 브라우저로 빠져나갈 수단을 준다.
  (function () {
    "use strict";

    // ★이 스크립트는 body 맨 위에서 실행된다 = 아래 메인 스크립트의 pairFromUrl 이
    //   ?g=&m= 를 주소창에서 지우기 **전**이다. 그래서 지금 붙잡아 두는 shareUrl 에는
    //   QR 페어링 파라미터가 그대로 살아 있다 — 복사·외부브라우저 전달에는 반드시 이 값을
    //   써야 다른 브라우저에서 열어도 페어링이 유지된다.
    var shareUrl = location.href;

    var ua = navigator.userAgent || "";
    var isKakao = /KAKAOTALK/i.test(ua);
    var isOtherInApp = /(NAVER\(inapp|DaumApps|Instagram|FBAN|FBAV|FB_IAB|Line\/|everytimeApp|WhaleOn)/i.test(ua);
    if (!isKakao && !isOtherInApp) return;

    var banner = document.getElementById("inappBanner");
    var textEl = document.getElementById("inappBannerText");
    var noteEl = document.getElementById("inappNote");
    var openBtn = document.getElementById("inappOpenBtn");
    var copyBtn = document.getElementById("inappCopyBtn");
    if (!banner || !textEl || !noteEl || !openBtn || !copyBtn) return;

    if (isKakao) {
      textEl.textContent = "카카오톡 안에서 열린 브라우저예요. 여기서는 앱 설치(홈 화면에 추가)와 필사 사진 올리기가 휴대폰 기종에 따라 막힐 수 있어요.";
      noteEl.textContent = "버튼이 안 되면 오른쪽 위 ⋯ 메뉴를 눌러 '다른 브라우저로 열기'를 선택해 주세요.";
      openBtn.style.display = "";
      openBtn.addEventListener("click", function () {
        location.href = "kakaotalk://web/openExternal?url=" + encodeURIComponent(shareUrl);
      });
    } else {
      textEl.textContent = "다른 앱 안의 간이 브라우저로 열렸어요. 여기서는 앱 설치(홈 화면에 추가)와 사진 올리기가 막힐 수 있어요.";
      noteEl.textContent = "'링크 복사'를 누른 뒤 크롬·사파리 같은 기본 브라우저 주소창에 붙여넣어 주세요.";
    }

    function copyLink(text, onDone) {
      function fallback() {
        try {
          var ta = document.createElement("textarea");
          ta.value = text;
          ta.setAttribute("readonly", "");
          ta.style.position = "fixed";
          ta.style.opacity = "0";
          document.body.appendChild(ta);
          ta.select();
          document.execCommand("copy");
          document.body.removeChild(ta);
          onDone(true);
        } catch (e) { onDone(false); }
      }
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(function () { onDone(true); }, fallback);
      } else {
        fallback();
      }
    }

    copyBtn.addEventListener("click", function () {
      copyLink(shareUrl, function (ok) {
        copyBtn.textContent = ok ? "복사됐어요!" : "복사 실패";
        setTimeout(function () { copyBtn.textContent = "링크 복사"; }, 1800);
      });
    });

    banner.style.display = "";
  })();
</script>

<script>
  // 서비스워커 등록 — 홈 화면에 추가한 사람이 다음에 열 때 자동으로 최신 버전을 받게 한다.
  // 갱신 전략(버전 캐시·skipWaiting·HTML network-first)은 sw.js 머리말 참고.
  (function () {
    if (!("serviceWorker" in navigator)) return;
    if (location.protocol !== "https:" && location.hostname !== "localhost") return;

    // 페이지 진입 시점에 이미 워커가 이 페이지를 제어하고 있었는지 기록해 둔다. 최초 설치
    // (clients.claim)로 발생하는 controllerchange 에서 불필요하게 새로고침하지 않기 위함.
    var hadController = !!navigator.serviceWorker.controller;
    var reloaded = false;
    navigator.serviceWorker.addEventListener("controllerchange", function () {
      if (!hadController || reloaded) return;
      reloaded = true;
      location.reload();
    });

    window.addEventListener("load", function () {
      navigator.serviceWorker.register("sw.js", { scope: "./", updateViaCache: "none" })
        .then(function (reg) { try { reg.update(); } catch (e) {} })
        .catch(function () {});
    });
  })();
</script>

<div class="page">
  <p class="eyebrow"><span class="member-badge">조원용</span>필사 × 읽기 소그룹 게임</p>
  <h1>요한복음 21주 말씀런</h1>
  <p class="sub">이름·제출 답안은 이 기기에 저장돼요. 리더가 등록해준 QR로 연결되면, 주차·요일 진행상황과 인증여부만 자동 동기화를 위해 클라우드(Firebase)에도 함께 저장돼요.</p>

  <div id="onboardArea"></div>

  <div id="mainArea" style="display:none;">
    <div class="status-bar">
      <div class="status-top">
        <span class="status-title"><span id="weekLabel">1</span>주차 · 요한복음 <span class="gold" id="chapterLabel">1</span>장</span>
        <span class="status-day" id="dayLabel">월요일</span>
      </div>
      <div class="sync-code-row">
        <input id="syncCodeInput" type="text" placeholder="리더에게 받은 동기화 코드 붙여넣기" autocomplete="off">
        <button class="action-btn primary" id="applySyncCodeBtn" type="button">코드 적용</button>
      </div>
      <p class="status-note" id="syncStatusNote"></p>
    </div>

    <div class="tabs" role="tablist">
      <button class="tab-btn" id="tabBtnToday" role="tab" aria-selected="true" type="button">오늘</button>
      <button class="tab-btn" id="tabBtnSettings" role="tab" aria-selected="false" type="button">설정</button>
    </div>

    <div class="tab-panel active" id="panelToday"></div>

    <div class="tab-panel" id="panelSettings">
      <div class="card">
        <h2>내 정보</h2>
        <div class="field-row">
          <label class="field-label" for="nameInput2">이름</label>
          <input id="nameInput2" type="text">
        </div>
        <button class="action-btn primary" id="saveSettingsBtn" type="button">저장</button>
      </div>
      <div class="card">
        <h2>데이터 초기화</h2>
        <p class="status-note">이름·시작일·이번 주 인증/제출 기록을 전부 지우고 처음부터 다시 시작합니다. 되돌릴 수 없어요.</p>
        <button class="action-btn danger" id="resetAllBtn" type="button">전체 데이터 초기화</button>

  function copyTextToClipboard(text, onDone) {
    function fallback() {
      try {
        var ta = document.createElement("textarea");
        ta.value = text;
        ta.style.position = "fixed";
        ta.style.opacity = "0";
        document.body.appendChild(ta);
        ta.focus();
        ta.select();
        document.execCommand("copy");
        document.body.removeChild(ta);
        onDone(true);
      } catch (e) {
        onDone(false);
      }
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function () { onDone(true); }, fallback);
    } else {
      fallback();
    }
  }

  // 갱신된다. 로컬 달력 계산은 완전히 제거됨: 조원의 폰 날짜나 수동조작이 리더의 실제
  // 진행상태와 어긋나는 문제를 근본적으로 없애기 위함. 코드에는 주차·요일·인증여부만
  // 담기고 정답은 절대 담기지 않는다 — QUIZ_DATA 자체에도 answer 필드가 없음(위 참고). ----------
  var SYNC_CODE_PREFIX = "WR21-";
  function parseSyncCode(codeStr) {
    var s = (codeStr || "").trim();
    if (s.indexOf(SYNC_CODE_PREFIX) !== 0) return null;
    var b64 = s.slice(SYNC_CODE_PREFIX.length).trim();
    if (!b64) return null;
    var json;
    try { json = JSON.parse(atob(b64)); } catch (e) { return null; }
    if (!json || typeof json !== "object") return null;
    if (typeof json.w !== "number" || json.w < 1 || json.w > TOTAL_WEEKS) return null;
    if (typeof json.d !== "number" || json.d < 0 || json.d > 6) return null;
    var result = { week: json.w, dayIndex: json.d };
    if (typeof json.fv === "boolean") result.forceVerified = json.fv;
    return result;
  }

  // ---------- 필사 사진 업로드 ----------
  // 사진을 곧바로 서버(Firestore)에 올리지 않고, 캔버스로 리사이즈·재압축(최대 1280px,
  // JPEG 품질 단계적 하향)해 문서 1개당 1MiB인 Firestore 한도 안에 항상 들어오도록 만든
  // 뒤에 전송한다. Firebase Storage를 쓰지 않는 이유는 이 프로젝트가 현재 무료(Spark)
  // 요금제이고 Storage 활성화에는 유료 업그레이드(결제수단 등록)가 필요하기 때문 — 결제는
  // 오너가 직접 결정할 일이라 이 세션에서는 대신 Firestore 문서 필드에 담는 방식을 택했다.
  var photoUploadBusy = false;
  function compressImageFile(file, cb) {
    var MAX_DIM = 1280;
    var QUALITY_STEPS = [0.72, 0.55, 0.4];
    var MAX_BYTES = 700000; // base64 인코딩 후에도 Firestore 1MiB 문서 한도에 여유 있게

    var reader = new FileReader();
    reader.onerror = function () { cb(new Error("read failed")); };
    reader.onload = function () {
      var img = new Image();
      img.onerror = function () { cb(new Error("image load failed")); };
      img.onload = function () {
        var w = img.naturalWidth || 1, h = img.naturalHeight || 1;
        var scale = Math.min(1, MAX_DIM / Math.max(w, h));
        var cw = Math.max(1, Math.round(w * scale));
        var ch = Math.max(1, Math.round(h * scale));
        var canvas = document.createElement("canvas");
        canvas.width = cw;
        canvas.height = ch;
        var ctx = canvas.getContext("2d");
        ctx.drawImage(img, 0, 0, cw, ch);
        var qi = 0;
        function tryQuality() {
          var q = QUALITY_STEPS[qi];
          var dataUrl;
          try { dataUrl = canvas.toDataURL("image/jpeg", q); } catch (e) { cb(e); return; }
          var approxBytes = Math.round(dataUrl.length * 0.75);
          if (approxBytes > MAX_BYTES && qi < QUALITY_STEPS.length - 1) {
            qi++;
            tryQuality();
            return;
          }
          cb(null, dataUrl);
        }
        tryQuality();
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  }

    card.className = "card";
    var h2 = document.createElement("h2");
    h2.textContent = QUIZ_DAY_LABEL[quizIdx] + "요일 퀴즈 · 요한복음 " + state.week + "장";
    card.appendChild(h2);

    if (!wd.verified) {
      var lockNote = document.createElement("p");
      lockNote.className = "empty-note";
      lockNote.textContent = "월요일 인증이 아직 안 됐어요. 필사 인증샷을 카톡으로 보내고 리더가 확인하면, 리더가 보내주는 동기화 코드를 위쪽 코드 입력칸에 붙여넣으세요 — 그러면 이 화면이 자동으로 열려요.";
      card.appendChild(lockNote);
      panelToday.appendChild(card);
      return;
    }

    if (!item) {
      var note = document.createElement("p");
      note.className = "empty-note";
      note.textContent = state.week + "주차 퀴즈 데이터가 아직 준비되지 않았어요.";
      card.appendChild(note);
      panelToday.appendChild(card);
      return;
    }

    var ref = document.createElement("p");
    ref.className = "quiz-ref";
    ref.textContent = state.week + "장 " + item.ref;
    card.appendChild(ref);

    var blank = document.createElement("p");
    blank.className = "quiz-blank";
    blank.textContent = item.blank;
    card.appendChild(blank);

    var submission = wd.submissions[quizIdx];
    var editing = !submission || showSubmitForm[quizIdx];

    if (submission && !editing) {
      var doneBadge = document.createElement("p");
      doneBadge.className = "submit-badge";
      doneBadge.textContent = "제출완료 ✓";
      card.appendChild(doneBadge);

      var answerShown = document.createElement("p");
      answerShown.className = "status-note";
      answerShown.style.marginTop = "0";
      answerShown.textContent = "내가 제출한 답: " + submission.answer;
      card.appendChild(answerShown);

      appendKakaoBox(card, submission.message);

      var editBtn = document.createElement("button");
      editBtn.className = "nav-btn";
      editBtn.type = "button";
      editBtn.textContent = "다시 제출하기";
      editBtn.addEventListener("click", function () {
        showSubmitForm[quizIdx] = true;
        renderToday();
      });
      card.appendChild(editBtn);
    } else {
      var inputRow = document.createElement("div");
      inputRow.className = "field-row";
      var inputLabel = document.createElement("label");
      inputLabel.className = "field-label";
      inputLabel.textContent = "정답 입력";
      inputRow.appendChild(inputLabel);
      var answerInput = document.createElement("input");
      answerInput.type = "text";
      answerInput.placeholder = "빈칸에 들어갈 말을 적어주세요";
      answerInput.value = submission ? submission.answer : "";
      inputRow.appendChild(answerInput);
      card.appendChild(inputRow);

      var submitBtn = document.createElement("button");
      submitBtn.className = "action-btn primary";
      submitBtn.type = "button";
      submitBtn.textContent = "제출";
      submitBtn.addEventListener("click", function () {
        var v = answerInput.value.trim();
        if (!v) return;
        var msg = state.name + " / " + state.week + "주차 " + DAY_NAMES[state.dayIndex] + " 정답 제출: " + v;
        wd.submissions[quizIdx] = { answer: v, message: msg, submittedAt: Date.now ? new Date().toISOString() : "" };
        showSubmitForm[quizIdx] = false;
        save();
        if (state.groupId && state.memberId && window.WR21FB) {
          window.WR21FB.ready.then(function (fb) {
            return fb.submitQuizAnswer(state.groupId, state.memberId, state.week, quizIdx, v);
          }).catch(function () {});
        }
        renderToday();
      });
      card.appendChild(submitBtn);

      var disc = document.createElement("p");
      disc.className = "disclaimer";
      disc.textContent = state.groupId && state.memberId
        ? "제출하면 리더 앱에 바로 전달돼요. 리더가 자동채점 결과를 확인하고 최종 확인을 누르면 쿠폰이 적립돼요."
        : "제출하면 리더에게 보낼 문자가 만들어져요. 카톡으로 보내면 리더가 그걸 보고 채점하고 쿠폰을 적립해요 — 이 화면의 '제출완료' 표시는 내 개인 진행 기록일 뿐, 공식 채점이 아니에요.";
      card.appendChild(disc);
    }

    panelToday.appendChild(card);
  }

  function appendKakaoBox(container, message) {
    var box = document.createElement("div");
    box.className = "kakao-box";
    var textWrap = document.createElement("div");
    textWrap.className = "kakao-text";
    var label = document.createElement("span");
    label.className = "kakao-label";
    label.textContent = "리더에게 보낼 문자";
    textWrap.appendChild(label);
    textWrap.appendChild(document.createTextNode(message));
    box.appendChild(textWrap);

    if (navigator.share) {
      var shareBtn = document.createElement("button");
      shareBtn.className = "nav-btn";
      shareBtn.type = "button";
      shareBtn.textContent = "카톡으로 보내기";
      shareBtn.addEventListener("click", function () {
        navigator.share({ text: message }).catch(function () {});
      });
      box.appendChild(shareBtn);
    } else {
      var copyBtn = document.createElement("button");
      copyBtn.className = "nav-btn";
      copyBtn.type = "button";
      copyBtn.textContent = "복사하기";
      copyBtn.addEventListener("click", function () {
        copyTextToClipboard(message, function (ok) {
          copyBtn.textContent = ok ? "복사됨 ✓" : "복사 실패";
          setTimeout(function () { copyBtn.textContent = "복사하기"; }, 1500);
        });
      });
      box.appendChild(copyBtn);
    }
    container.appendChild(box);
  }

  function renderSunday() {
    var wd = getWeekData(state.week);
    var card = document.createElement("div");
    card.className = "card";
    var h2 = document.createElement("h2");
    h2.textContent = "이번 주 제출 현황";
    card.appendChild(h2);

    var intro = document.createElement("p");
    intro.className = "status-note";
    intro.style.marginTop = "0";
    intro.textContent = "화~토에 제출한 내용을 모아봤어요(정답 확인은 아니에요 — 리더가 카톡으로 받은 메시지를 보고 채점해요). 소그룹 모임이 끝나면 리더가 보내주는 동기화 코드를 받아 위 칸에 붙여넣으면 다음 주로 넘어가요.";
    card.appendChild(intro);

    var weekQuizzes = QUIZ_DATA[state.week] || [];
    for (var i = 0; i < 5; i++) {
      var row = document.createElement("div");
      row.className = "week-summary-row";
      var label = document.createElement("span");
      label.className = "wd-label";
      label.textContent = QUIZ_DAY_LABEL[i] + "요일";
      row.appendChild(label);
      var statusEl = document.createElement("span");
      var sub = wd.submissions[i];
      if (sub) {
        statusEl.className = "wd-status done";
        statusEl.textContent = "제출완료: " + sub.answer;
      } else {
        statusEl.className = "wd-status";
        statusEl.textContent = wd.verified ? "미제출" : "(월요일 인증 전)";
      }
      row.appendChild(statusEl);
      card.appendChild(row);
    }
    panelToday.appendChild(card);
  }

  function renderAll() {
    renderOnboarding();
    if (state.name) {
      renderStatusBar();
      renderToday();
    }
  }

  // ---------- 이벤트 ----------
  // 동기화 코드 적용 — 이 앱에서 주차·요일·인증상태를 바꾸는 유일한 경로. 리더 발급 코드가
  // 상태의 단일 출처이므로, 이전에 있던 하루전/하루뒤/오늘재동기화/다음주로 같은 자기주도
  // 이동 버튼은 전부 제거되었다(로컬 달력 계산 자체가 없으므로 "이미 화~토인데 월요일
  // 화면에 영영 못 돌아가는" 옛 버그의 원인 자체가 사라짐 — 버튼 제거가 그 버그의 재발이
  // 아니라 근본 원인 제거임).
  var syncCodeInput = document.getElementById("syncCodeInput");
  var applySyncCodeBtn = document.getElementById("applySyncCodeBtn");
  applySyncCodeBtn.addEventListener("click", function () {
    var parsed = parseSyncCode(syncCodeInput.value);
    if (!parsed) {
      syncStatusNote.textContent = "코드가 올바르지 않아요. 리더에게 받은 코드를 다시 확인해 붙여넣어 주세요.";
      return;
    }
    var weekChanged = parsed.week !== state.week;
    state.week = parsed.week;
    state.dayIndex = parsed.dayIndex;
    if (typeof parsed.forceVerified === "boolean") {
      var wd = getWeekData(state.week);
      wd.verified = parsed.forceVerified;
    }
    if (weekChanged) showSubmitForm = {};
    syncCodeInput.value = "";
    save();
    renderAll();
    syncStatusNote.textContent = state.week + "주차 " + DAY_NAMES[state.dayIndex] + "로 업데이트됐어요.";
  });

  // 탭 전환
  var tabs = [
    { btn: document.getElementById("tabBtnToday"), panel: document.getElementById("panelToday") },
    { btn: document.getElementById("tabBtnSettings"), panel: document.getElementById("panelSettings") }
  ];
  tabs.forEach(function (t) {
    t.btn.addEventListener("click", function () {
      tabs.forEach(function (o) {
        o.btn.setAttribute("aria-selected", o === t ? "true" : "false");
        o.panel.classList.toggle("active", o === t);
      });
      if (t.btn.id === "tabBtnSettings") {
        document.getElementById("nameInput2").value = state.name || "";
      }
    });
  });

  document.getElementById("saveSettingsBtn").addEventListener("click", function () {
    var n = document.getElementById("nameInput2").value.trim();
    if (n) state.name = n;
    save(); renderAll();
  });

  var resetBtn = document.getElementById("resetAllBtn");
  var resetArmTimer = null;
  resetBtn.addEventListener("click", function () {
    if (!resetArmed) {
      resetArmed = true;
      resetBtn.classList.add("armed");
      resetBtn.textContent = "정말 초기화? 다시 탭";
      resetArmTimer = setTimeout(function () {
        resetArmed = false;
        resetBtn.classList.remove("armed");
        resetBtn.textContent = "전체 데이터 초기화";
      }, 4000);
      return;
    }
    clearTimeout(resetArmTimer);
    try { localStorage.removeItem(STORAGE_KEY); } catch (e) {}
    state = defaultState();
    showSubmitForm = {};
    resetArmed = false;
    resetBtn.classList.remove("armed");
    resetBtn.textContent = "전체 데이터 초기화";
    save(); renderAll();
  });

  // 테마
  var themeToggle = document.getElementById("themeToggle");
  themeToggle.addEventListener("click", function () {
    var root = document.documentElement;
    var current = root.getAttribute("data-theme");
    var next = current === "dark" ? "light" : "dark";
    root.setAttribute("data-theme", next);
    state.themeSaved = next;
    save();
  });
  if (state.themeSaved) document.documentElement.setAttribute("data-theme", state.themeSaved);

  // Firebase 준비되는 즉시(페어링 정보가 있을 때만) 그룹·멤버 문서에 실시간 리스너를 건다.
  // 그룹 문서(공통 week/dayIndex)와 멤버 문서(이 조원만의 verified)는 별개 스냅샷으로
  // 독립 도착하므로, 최근 수신값을 각각 저장해뒀다가 매번 함께 조합해 반영한다 — 기존 수동
  // 동기화 코드의 "월요일(dayIndex 0)에 인증되면 그 조원만 화요일로" 로직(리더 앱의
  // syncDayIndex = state.dayIndex===0 ? 1 : state.dayIndex, fv:true)과 동일한 결과가 되도록
  // 그대로 재현한다 — 그렇지 않으면 리더가 nextDayBtn까지 눌러야만 넘어가버려 "인증하면 바로
  // 다음부터 퀴즈가 자동으로 뜨게" 해달라는 오너 요청의 핵심이 깨진다.
  var lastGroupData = null;
  var lastMemberData = null;
  function applyRealtimeState() {
    if (!lastGroupData) return;
    var week = lastGroupData.week;
    var dayIndex = lastGroupData.dayIndex;
    var verifiedForThisWeek = !!(lastMemberData && lastMemberData.verified && lastMemberData.verifiedWeek === week);
    if (dayIndex === 0 && verifiedForThisWeek) dayIndex = 1;
    var weekChanged = week !== state.week;
    state.week = week;
    state.dayIndex = dayIndex;
    if (verifiedForThisWeek) getWeekData(week).verified = true;
    if (weekChanged) showSubmitForm = {};
    save();
    renderAll();
  }
  if (window.WR21FB && window.WR21FB.ready) {
    window.WR21FB.ready.then(function (fb) {
      fbApi = fb;
      if (!state.groupId || !state.memberId) return;
      fb.watchGroup(state.groupId, function (data) {
        lastGroupData = data;
        applyRealtimeState();
      });
      fb.watchMember(state.groupId, state.memberId, function (data) {
        if (data.name && !state.name) { state.name = data.name; save(); }
        lastMemberData = data;
        applyRealtimeState();
      });
    }).catch(function () {});
  }

  renderAll();
})();
</script>
</body>
</html>
